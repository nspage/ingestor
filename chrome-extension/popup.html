<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Pipeline</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #101114;
      color: #ececec;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .brand { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #8b8f98;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .helper-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #2a2c32;
      background: #17181c;
      border-radius: 999px;
      padding: 2px 8px 2px 6px;
      font-size: 11px;
      font-weight: 650;
      width: auto;
      margin: 0;
    }
    .helper-pill:disabled { opacity: 1; cursor: default; }
    .helper-pill.off { cursor: pointer; color: #ef7a7a; border-color: rgba(239, 122, 122, 0.35); }
    .helper-pill.on { cursor: default; color: #5ecf8a; border-color: rgba(94, 207, 138, 0.35); }
    .helper-dot { width: 7px; height: 7px; border-radius: 50%; background: #8b8f98; }
    .helper-pill.on .helper-dot { background: #5ecf8a; box-shadow: 0 0 0 3px rgba(94, 207, 138, 0.18); }
    .helper-pill.off .helper-dot { background: #ef7a7a; box-shadow: 0 0 0 3px rgba(239, 122, 122, 0.18); }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #open { background: #6b75d6; color: #fff; }
    #start { background: #2a2c32; color: #ececec; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="brand">Pipeline</div>
  <div id="status" class="status">
    <button type="button" id="helper-pill" class="helper-pill off" aria-live="polite" title="Start helper">
      <span class="helper-dot" aria-hidden="true"></span>
      <span id="helper-label">Checking…</span>
    </button>
    <span id="status-meta"></span>
  </div>
  <button type="button" id="open">Open pipeline</button>
  <button type="button" id="start" class="hidden">Start helper</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
