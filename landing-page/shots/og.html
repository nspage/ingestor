<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OG</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f9f9f9; }
    body {
      font-family: "Space Grotesk", "Inter", -apple-system, sans-serif;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 48px;
      padding: 56px 56px 56px 64px;
      align-items: center;
      color: #1b1b1b;
    }
    .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #ff7759; margin-bottom: 16px; }
    h1 { font-size: 44px; line-height: 1.05; font-weight: 500; letter-spacing: -0.04em; margin: 0 0 16px; }
    p { margin: 0; font-size: 18px; line-height: 1.4; color: #5f5e64; max-width: 520px; font-family: Inter, -apple-system, sans-serif; }
    .well {
      width: 400px; height: 518px; background: #eeece7; border-radius: 22px; padding: 12px;
      box-shadow: 0 24px 60px rgba(27,27,27,0.12);
    }
    iframe { width: 400px; height: 494px; border: 0; border-radius: 16px; background: #101114; }
  </style>
</head>
<body>
  <div>
    <div class="eyebrow">ingestor</div>
    <h1>An inbox for the channels you already follow.</h1>
    <p>Triage. Extract. Keep the Markdown.</p>
  </div>
  <div class="well">
    <iframe src="pending.html"></iframe>
  </div>
</body>
</html>
